<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/favicon.png">
<title>Dashboard — Hermes Agent Mission Control</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&amp;family=VT323&amp;display=swap">
<style>
/* ---- shared: base ---- */
html,body{margin:0;height:100%;background:#191A21}
body{font-size:12px}
a{color:#50FA7B;text-decoration:none;transition:color .15s}
a:hover{color:#8BE9FD}
button{transition:background-color .15s,border-color .15s,color .15s,opacity .15s,transform .1s}
button:active{transform:scale(.97)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:1px solid #50FA7B;outline-offset:1px}
input:focus,textarea:focus,select:focus{outline:1px solid #6272A4}
svg.ic{display:block;flex:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:1px solid transparent;border-radius:6px;background:transparent;color:#A9B2D3;cursor:pointer}
.ib:hover{background:#343746;color:#F8F8F2}
.ib.on{color:#50FA7B}
.ib.sm{width:24px;height:24px}
.vh{position:absolute!important;top:0;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- shared: scrollbars match the UI ---- */
*{scrollbar-width:thin;scrollbar-color:#44475A transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#44475A;border-radius:4px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#6272A4;background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}

/* ---- shared: motion ---- */
@keyframes mcIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes mcFade{from{opacity:0}to{opacity:1}}
@keyframes mcPop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes mcSlideL{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes mcDown{from{opacity:0;max-height:0}to{opacity:1;max-height:900px}}
@keyframes mcToastBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes mcpulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.7);opacity:0}}
@keyframes mcflow{from{left:0}to{left:calc(100% - 8px)}}
@keyframes mcBlink{50%{opacity:0}}
.mc-in{animation:mcIn .32s cubic-bezier(.2,.7,.2,1) both}
.mc-fade{animation:mcFade .25s ease both}
.mc-pop{animation:mcPop .22s cubic-bezier(.2,.7,.2,1) both}
.mc-slide{animation:mcSlideL .28s cubic-bezier(.2,.7,.2,1) both}
.mc-down{animation:mcDown .32s cubic-bezier(.2,.7,.2,1) both;overflow:hidden}
.mc-blink{animation:mcBlink 1s steps(1) infinite}
/* chat: my message leaves the composer, the agent's reply arrives */
@keyframes mcSend{0%{opacity:0;transform:translateY(18px) scale(.9)}60%{opacity:1;transform:translateY(-2px) scale(1.01)}100%{opacity:1;transform:none}}
@keyframes mcRecv{0%{opacity:0;transform:translateX(-14px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes mcRecvEdge{0%,30%{border-color:#50FA7B}100%{border-color:#44475A}}
@keyframes mcFly{0%{transform:none;opacity:1}45%{transform:translate(9px,-9px);opacity:0}46%{transform:translate(-9px,9px);opacity:0}100%{transform:none;opacity:1}}
@keyframes mcDot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-3px);opacity:1}}
.mc-send{animation:mcSend .4s cubic-bezier(.2,.8,.2,1) both;transform-origin:100% 100%}
.mc-recv{animation:mcRecv .34s cubic-bezier(.2,.8,.2,1) both,mcRecvEdge 1.6s ease-out both;transform-origin:0 100%}
.mc-fly{animation:mcFly .45s cubic-bezier(.4,0,.2,1) both}
.mc-dots{display:inline-flex;align-items:center;gap:3px}
.mc-dots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:mcDot 1s ease-in-out infinite}
.mc-dots i:nth-child(2){animation-delay:.15s}
.mc-dots i:nth-child(3){animation-delay:.3s}
.mc-nomotion *,.mc-nomotion *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- shared: browser surfaces ---- */
::selection{background:#44475A;color:#F8F8F2}
input,textarea{caret-color:#50FA7B}
.dot{display:inline-block;width:6px;height:6px;flex:none;border-radius:50%;vertical-align:middle}
.num{font-variant-numeric:tabular-nums}

/* ---- shared: persistent sidebar (main menu) ---- */
.mc-body{flex:1;min-height:0;display:flex}
.mc-col{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.mc-side{flex:none;width:184px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding:12px 8px 8px;border-right:1px solid #44475A;background:#191A21;overflow-y:auto;overflow-x:hidden;transition:width .22s cubic-bezier(.2,.8,.2,1)}
.mc-side.is-rail{width:56px;padding-left:6px;padding-right:6px}
.mc-side-logo{flex:none;display:flex;align-items:center;gap:9px;padding:0 6px 10px;white-space:nowrap}
.mc-side-logo .lg-img{flex:none;display:block;width:28px;height:28px}
.mc-side-logo .lg-text{color:#A9B2D3;font-size:9px;font-weight:700;letter-spacing:1.5px;line-height:1.3}
.mc-side.is-rail .mc-side-logo{justify-content:center;padding-left:0;padding-right:0}
.mc-side.is-rail .lg-text{display:none}
.mc-side-nav{flex:1;min-height:0;display:flex;flex-direction:column;gap:2px}
.mc-side-foot{flex:none;display:flex;flex-direction:column;gap:2px;margin-top:8px;padding-top:8px;border-top:1px solid #343746}
.sn{position:relative;display:flex;align-items:center;gap:10px;flex:none;min-height:34px;padding:0 10px;border:0;border-radius:8px;box-sizing:border-box;background:transparent;color:#A9B2D3;font:inherit;font-size:12px;white-space:nowrap;cursor:pointer;text-decoration:none;text-align:left;transition:color .15s,background-color .15s}
.sn:hover{background:#282A36;color:#F8F8F2}
.sn.on{background:#343746;color:#50FA7B;font-weight:600}
.sn:active{transform:none}
.sn .tl{overflow:hidden;text-overflow:ellipsis}
.sn .bd{margin-left:auto;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;font-size:10px;font-weight:700;line-height:16px;text-align:center;color:#191A21}
.sn-sep{flex:none;height:1px;margin:6px 8px;background:#343746}
.mc-side.is-rail .sn{justify-content:center;padding:0}
.mc-side.is-rail .sn .tl{display:none}
.mc-side.is-rail .sn .bd{position:absolute;top:3px;right:3px;min-width:12px;height:12px;padding:0 3px;border-radius:6px;font-size:8px;line-height:12px}
.mc-side.is-rail .sn-sep{margin:6px 10px}
.mc-side.is-rail .mc-side-foot .sn:last-child svg{transform:rotate(180deg)}
@media (max-width:900px){.mc-side{width:56px;padding-left:6px;padding-right:6px}.mc-side .lg-text,.mc-side .sn .tl{display:none}.mc-side-logo{justify-content:center;padding-left:0;padding-right:0}.mc-side .sn{justify-content:center;padding:0}.mc-side .sn .bd{position:absolute;top:3px;right:3px;min-width:12px;height:12px;padding:0 3px;font-size:8px;line-height:12px}.mc-side-foot .sn:last-child{display:none}}
.cbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:28px;padding:0 11px;border:1px solid #6272A4;border-radius:6px;background:transparent;color:#F8F8F2;font:inherit;cursor:pointer}
.cbtn:hover{background:#343746}
.cbtn.pri{border:0;background:#50FA7B;color:#282A36;font-weight:700}
/* shared small controls (settings panels) */
.cb{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:28px;padding:0 11px;border:1px solid #6272A4;border-radius:6px;background:transparent;color:#F8F8F2;font:inherit;cursor:pointer;text-decoration:none}
.cb:hover{background:#343746}
.cb.pri{border:0;background:#50FA7B;color:#282A36;font-weight:700}
.cb.pri[disabled]{background:#44475A;color:#8B95BD;cursor:not-allowed}
.cb.dng{border-color:#FF5555;color:#FF5555}
.tag{display:inline-block;padding:0 6px;border:1px solid #44475A;border-radius:3px;color:#A9B2D3;font-size:11px;white-space:nowrap}
.ckb{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;padding:0;border:1px solid #6272A4;border-radius:4px;background:transparent;color:#282A36;cursor:pointer}
.ckb[aria-checked="true"]{background:#50FA7B;border-color:#50FA7B}
.ckb[disabled]{cursor:not-allowed;opacity:.6}
.cmd{margin:0;padding:6px 8px;border:1px solid #44475A;border-radius:6px;background:#191A21;color:#F1FA8C;font:inherit;font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere}
/* command palette */
.pal-row{display:flex;align-items:center;gap:10px;width:100%;min-height:32px;padding:0 12px;border:0;background:transparent;color:#F8F8F2;font:inherit;text-align:left;cursor:pointer}
.pal-row:hover,.pal-row[aria-selected="true"]{background:#343746}
.pal-chip{flex:none;min-width:50px;padding:1px 6px;border:1px solid #44475A;border-radius:4px;color:#A9B2D3;font-size:10px;text-align:center}
kbd{padding:0 5px;border:1px solid #44475A;border-radius:4px;background:#282A36;color:#A9B2D3;font:inherit;font-size:10px}
@keyframes mcTermUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.mc-hsep:hover>span,.mc-hsep:focus-visible>span{background:#50FA7B}
/* note reader: wikilinks */
.wl{display:inline;padding:0;border:0;background:transparent;color:#BD93F9;font:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:#6272A4;text-underline-offset:2px}
.wl:hover{color:#FF79C6}
.md-note h1,.md-note div{overflow-wrap:anywhere}

/* ---- shared: status bar, modal, toasts ---- */
.sb-item{display:inline-flex;align-items:center;gap:6px;padding:0 8px;border:0;background:transparent;color:#A9B2D3;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap}
.sb-item:hover{background:#343746;color:#F8F8F2}
.sb-item:active{transform:none}
.set-tab{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:#A9B2D3;font:inherit;text-align:left;cursor:pointer}
.set-tab:hover{background:#343746;color:#F8F8F2}
.sw{position:relative;width:32px;height:18px;flex:none;padding:0;border:0;border-radius:9px;background:#44475A;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:#A9B2D3;transition:transform .18s,background-color .18s}
.sw[aria-checked="true"]{background:#2E6B40}
.sw[aria-checked="true"]::after{transform:translateX(14px);background:#50FA7B}
.fld{min-height:28px;box-sizing:border-box;padding:0 8px;border:1px solid #44475A;border-radius:6px;background:#282A36;color:#F8F8F2;font:inherit}

.mc-sep:hover>span,.mc-sep:focus-visible>span{background:#50FA7B}
.mc-row{flex-wrap:nowrap}
.ag-row{display:flex;align-items:center;gap:2px;min-height:30px;padding:0 4px 0 2px;border:1px solid transparent;border-radius:8px;transition:background-color .15s,border-color .15s,opacity .15s}
.ag-row:hover{background:#282A36!important;border-color:#44475A}
.ag-pick{display:flex;align-items:center;gap:7px;flex:1;min-width:0;min-height:28px;padding:0 4px;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ag-grip{color:#44475A;cursor:grab;display:flex}
.ag-row:hover .ag-grip{color:#8B95BD}
.ag-pin{color:#8B95BD;opacity:0}
.ag-row:hover .ag-pin,.ag-pin:focus-visible,.ag-pin.on{opacity:1}
.ag-pin.on{color:#BD93F9}
.ag-sec{padding:6px 6px 2px;color:#8B95BD;font-size:9px;letter-spacing:1px;text-transform:uppercase}
.ag-search{display:flex;align-items:center;gap:6px;min-height:30px;padding:0 4px 0 8px;border:1px solid #44475A;border-radius:8px;background:#282A36;color:#8B95BD}
.ag-search:focus-within{border-color:#BD93F9}
.ag-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#F8F8F2;font:inherit;font-size:11px}
.panel{border:1px solid #44475A;border-radius:12px;background:#21222C}
.ph{display:flex;align-items:center;gap:8px;min-height:30px}
.ph h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.2px;color:#BD93F9;text-transform:lowercase}
.dash-row{display:flex;flex-direction:column;width:100%;padding:5px 6px;border:0;border-top:1px dashed #343746;border-radius:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.dash-row:hover{background:#282A36}
.dash-row:active{transform:none}
@media (max-width:900px){.mc-root{height:auto!important;overflow:visible!important}.mc-row{flex-wrap:wrap}.mc-sep{display:none}.mc-chat{order:-1;min-height:480px}}
</style>
<script src="mc-runtime.js" defer></script>
</head>
<body>
<div id="mc-root"></div>
<script type="text/x-dc-template" id="mc-template">
<div class="mc-root {{rootClass}}" style="zoom: {{uiZoom}}; height: calc(100vh / {{uiZoom}}); overflow: hidden; display: flex; flex-direction: column; background: #191A21; color: #F8F8F2; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: {{fs}}px; line-height: 1.45">
<div class="mc-body">
  <aside class="mc-side {{sideCls}}" aria-label="Sidebar">
    <div class="mc-side-logo">
      <img class="lg-img" src="assets/logo-mark.png" width="28" height="28" alt="Hermes Agent Mission Control">
      <span class="lg-text" aria-hidden="true">HERMES AGENT<br>MISSION CONTROL</span>
    </div>
    <nav aria-label="Main" class="mc-side-nav">
      <a href="Main.html" class="sn {{nav.dash}}" aria-current="{{navCur.dash}}" title="Dashboard · Ctrl+1"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span class="tl">Dashboard</span></a>
      <a href="Chat.html" class="sn {{nav.chat}}" aria-current="{{navCur.chat}}" aria-label="Chat, 2 unread" title="Chat · Ctrl+2"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="tl">Chat</span><span class="bd" aria-hidden="true" style="background: #8BE9FD">2</span></a>
      <a href="LiveFeed.html" class="sn {{nav.feed}}" aria-current="{{navCur.feed}}" title="Live feed · Ctrl+3"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span class="tl">Live feed</span></a>
      <span class="sn-sep" aria-hidden="true"></span>
      <a href="Sessions.html" class="sn {{nav.sess}}" aria-current="{{navCur.sess}}" title="Sessions · Ctrl+4"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg><span class="tl">Sessions</span></a>
      <a href="Kanban.html" class="sn {{nav.kanban}}" aria-current="{{navCur.kanban}}" title="Kanban · Ctrl+5"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v11M12 5v6M18 5v14"/></svg><span class="tl">Kanban</span></a>
      <a href="Usage.html" class="sn {{nav.usage}}" aria-current="{{navCur.usage}}" title="Usage · Ctrl+6"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 20V10M12 20V4M6 20v-6"/></svg><span class="tl">Usage</span></a>
      <span class="sn-sep" aria-hidden="true"></span>
      <a href="Skills.html" class="sn {{nav.skills}}" aria-current="{{navCur.skills}}" title="Skills · Ctrl+7"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg><span class="tl">Skills</span></a>
      <a href="Logs.html" class="sn {{nav.logs}}" aria-current="{{navCur.logs}}" aria-label="Logs, 2 errors in the last hour" title="Logs · Ctrl+8"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg><span class="tl">Logs</span><span class="bd" aria-hidden="true" style="background: #FFB86C">2</span></a>
      <a href="Brain.html" class="sn {{nav.brain}}" aria-current="{{navCur.brain}}" title="Second brain · Ctrl+9"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg><span class="tl">Second brain</span></a>
      <a href="Server.html" class="sn {{nav.server}}" aria-current="{{navCur.server}}" title="Server · Ctrl+0"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/></svg><span class="tl">Server</span></a>
    </nav>
    <div class="mc-side-foot">
      <button type="button" class="sn {{termOn}}" onClick="{{toggleTerminal}}" aria-pressed="{{termPressed}}" title="Terminal · Ctrl+`"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg><span class="tl">Terminal</span></button>
      <button type="button" class="sn" onClick="{{openPalette}}" title="Search and commands · Ctrl+K"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><span class="tl">Search</span><kbd class="tl" style="margin-left: auto">Ctrl K</kbd></button>
      <button type="button" class="sn" onClick="{{toggleSide}}" aria-expanded="{{sideExpanded}}" aria-label="Collapse sidebar" title="{{sideToggleTitle}}"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg><span class="tl">Collapse</span></button>
    </div>
  </aside>

<div class="mc-col">
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px">
    <div class="mc-row" style="flex: 1; min-height: 0; display: flex; gap: 8px">

      <div style="flex: 0 1 240px; min-width: 200px; min-height: 0; display: flex; flex-direction: column; gap: 8px">
        <div class="mc-in" style="flex: none; padding: 2px 4px; color: #A9B2D3; font-size: 11px"><span class="dot" style="background: #50FA7B"></span> {{agentsOnlineLong}}</div>

        <section class="panel mc-in" aria-label="Cron jobs" style="flex: {{cronFlex}}; min-height: 0; display: flex; flex-direction: column; animation-delay: .04s">
          <div class="ph" style="padding: 4px 6px 4px 12px">
            <h2>CRON</h2>
            <span style="color: #8B95BD; font-size: 10px">9 jobs · <span style="color: #FF5555">1 err</span></span>
            <span style="margin-left: auto; display: flex; gap: 2px">
              <button type="button" class="ib sm" onClick="{{openCron}}" aria-label="Open cron jobs" title="Open cron jobs"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
              <sc-if value="{{cronOpen}}" hint-placeholder-val="{{true}}"><button type="button" class="ib sm" onClick="{{toggleCron}}" aria-label="Hide cron" title="Hide"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"/></svg></button></sc-if>

                        <span style="color: {{fetchColor}}; font-size: 11px">{{fetchNote}}</span>
                      </div>
                      <sc-if value="{{hasModels}}" hint-placeholder-val="{{false}}">
                        <input type="search" class="fld" aria-label="Filter models" value="{{mFilter}}" onChange="{{onFilter}}" placeholder="Filter models">
                        <div role="radiogroup" aria-label="Models" style="max-height: 150px; overflow-y: auto; border: 1px solid #44475A; border-radius: 6px">

                            <button type="button" role="radio" aria-checked="{{md.checked}}" onClick="{{md.pick}}" style="display: flex; width: 100%; align-items: center; gap: 10px; min-height: 30px; padding: 0 10px; border: 0; border-bottom: 1px solid #343746; background: {{md.bg}}; color: #F8F8F2; font: inherit; text-align: left; cursor: pointer"><span class="dot" style="width: 8px; height: 8px; border: 1px solid {{md.dot}}; background: {{md.fill}}"></span><span style="flex: 1">{{md.id}}</span><span style="color: #8B95BD; font-size: 10px">ctx {{md.ctx}}</span></button>
                          </sc-for>
                        </div>
                      </sc-if>
                      <div role="group" aria-label="Reasoning effort" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px">
                        <span style="color: #A9B2D3; margin-right: 4px">Reasoning</span>
                        <sc-for list="{{efforts}}" as="ef"><button type="button" onClick="{{ef.pick}}" aria-pressed="{{ef.pressed}}" style="min-height: 26px; padding: 0 8px; border: 1px solid {{ef.border}}; border-radius: 6px; background: {{ef.bg}}; color: {{ef.fg}}; font: inherit; font-size: 11px; cursor: pointer">{{ef.label}}</button></sc-for>
                      </div>
                      <pre style="margin: 0; padding: 8px 10px; border: 1px solid #44475A; border-radius: 6px; background: #191A21; color: #F1FA8C; font: inherit; font-size: 11px; white-space: pre-wrap; overflow-wrap: anywhere">{{cmdPreview}}</pre>
                      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
                        <button type="button" onClick="{{testModel}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border: 1px solid #8BE9FD; border-radius: 6px; background: transparent; color: #8BE9FD; font: inherit; cursor: pointer"><svg class="ic" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>Test</button>
                        <button type="button" onClick="{{saveModel}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: {{modelSaveBg}}; color: #282A36; font: inherit; font-weight: 700; cursor: pointer"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Save</button>
                        <span style="color: {{testColor}}; font-size: 11px">{{testText}}</span>
                      </div>
                    </sc-if>

                    <sc-if value="{{cfgSoul}}" hint-placeholder-val="{{false}}">
                      <div style="display: flex; flex-wrap: wrap; gap: 12px">
                        <label style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px; color: #A9B2D3">SOUL.md <span style="color: #8B95BD; font-size: 11px">{{soulLen}} characters</span>
                          <textarea id="cfg-soul" rows="14" value="{{soul}}" onChange="{{onSoul}}" style="resize: vertical; border: 1px solid #44475A; border-radius: 6px; background: #191A21; color: #F8F8F2; font: inherit; font-size: 11px; line-height: 1.6; padding: 8px 10px"></textarea>
                        </label>
                        <div style="flex: 1 1 220px; padding: 10px 12px 4px; border: 1px solid #44475A; border-radius: 8px; background: #282A36; font-size: 11px"><sc-for list="{{soulBlocks}}" as="blk"><sc-if value="{{blk.isP}}"><p style="margin: 0 0 6px"><sc-for list="{{blk.segs}}" as="sg"><sc-if value="{{sg.code}}"><code style="padding: 0 4px; border-radius: 3px; background: #191A21; color: #F1FA8C">{{sg.t}}</code></sc-if><sc-if value="{{sg.bold}}"><strong style="color: #F8F8F2">{{sg.t}}</strong></sc-if><sc-if value="{{sg.plain}}">{{sg.t}}</sc-if><sc-if value="{{sg.wiki}}"><button type="button" class="wl" onClick="{{sg.pick}}">{{sg.t}}</button></sc-if><sc-if value="{{sg.wikiOff}}"><span style="color: #BD93F9">{{sg.t}}</span></sc-if></sc-for></p></sc-if><sc-if value="{{blk.isH}}"><div style="margin: 0 0 4px; font-weight: 700; color: #BD93F9"><sc-for list="{{blk.segs}}" as="sg"><sc-if value="{{sg.code}}"><code style="padding: 0 4px; border-radius: 3px; background: #191A21; color: #F1FA8C">{{sg.t}}</code></sc-if><sc-if value="{{sg.bold}}"><strong style="color: #F8F8F2">{{sg.t}}</strong></sc-if><sc-if value="{{sg.plain}}">{{sg.t}}</sc-if><sc-if value="{{sg.wiki}}"><button type="button" class="wl" onClick="{{sg.pick}}">{{sg.t}}</button></sc-if><sc-if value="{{sg.wikiOff}}"><span style="color: #BD93F9">{{sg.t}}</span></sc-if></sc-for></div></sc-if><sc-if value="{{blk.isUl}}"><ul style="margin: 0 0 6px; padding-left: 16px"><sc-for list="{{blk.items}}" as="li"><li><sc-for list="{{li.segs}}" as="sg"><sc-if value="{{sg.code}}"><code style="padding: 0 4px; border-radius: 3px; background: #191A21; color: #F1FA8C">{{sg.t}}</code></sc-if><sc-if value="{{sg.bold}}"><strong style="color: #F8F8F2">{{sg.t}}</strong></sc-if><sc-if value="{{sg.plain}}">{{sg.t}}</sc-if><sc-if value="{{sg.wiki}}"><button type="button" class="wl" onClick="{{sg.pick}}">{{sg.t}}</button></sc-if><sc-if value="{{sg.wikiOff}}"><span style="color: #BD93F9">{{sg.t}}</span></sc-if></sc-for></li></sc-for></ul></sc-if><sc-if value="{{blk.isCode}}"><pre style="margin: 0 0 6px; padding: 6px 8px; border: 1px solid #44475A; border-radius: 6px; background: #191A21; color: #F1FA8C; font: inherit; font-size: 11px; white-space: pre-wrap">{{blk.text}}</pre></sc-if></sc-for></div>
                      </div>
                    </sc-if>

                    <sc-if value="{{cfgEntries}}" hint-placeholder-val="{{false}}">
                      <div style="display: flex; align-items: center; gap: 10px">
                        <span style="color: #F8F8F2; font-weight: 600">{{entFile}}</span>
                        <sc-if value="{{entDirty}}"><span style="color: #FFB86C; font-size: 11px"><span class="dot" style="background: #FFB86C"></span> unsaved</span></sc-if>
                        <span class="num" style="margin-left: auto; color: {{entColor}}; font-size: 11px">{{entCount}} / {{entLimit}}</span>
                      </div>
                      <div role="img" aria-label="{{entCount}} of {{entLimit}} characters" style="height: 4px; border-radius: 2px; background: #44475A"><div style="height: 4px; border-radius: 2px; width: {{entPct}}%; background: {{entColor}}; transition: width .2s"></div></div>
                      <sc-for list="{{entries}}" as="en" hint-placeholder-count="4">
                        <div data-key="{{en.key}}" style="display: flex; gap: 6px; align-items: stretch">
                          <label for="{{en.id}}" class="vh">Entry {{en.n}}</label>
                          <textarea id="{{en.id}}" rows="2" value="{{en.text}}" onChange="{{en.change}}" style="flex: 1; resize: vertical; border: 1px solid {{en.border}}; border-radius: 6px; background: #282A36; color: #F8F8F2; font: inherit; font-size: 11px; padding: 6px 8px"></textarea>
                          <button type="button" class="ib" onClick="{{en.remove}}" aria-label="Delete entry {{en.n}}" title="Delete entry" style="height: auto; color: #FF5555"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
                        </div>
                      </sc-for>
                      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
                        <button type="button" onClick="{{addEntry}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border: 1px dashed #6272A4; border-radius: 6px; background: transparent; color: #A9B2D3; font: inherit; cursor: pointer"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add entry</button>
                        <span style="flex: 1"></span>
                        <button type="button" onClick="{{revertEntries}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border: 1px solid #6272A4; border-radius: 6px; background: transparent; color: #A9B2D3; font: inherit; cursor: pointer"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>Revert</button>
                        <button type="button" onClick="{{reviewEntries}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: {{entSaveBg}}; color: #282A36; font: inherit; font-weight: 700; cursor: pointer"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Review &amp; save</button>
                      </div>
                      <sc-if value="{{reviewing}}" hint-placeholder-val="{{false}}">
                        <div class="mc-down" style="display: flex; flex-direction: column; gap: 4px; padding: 8px; border: 1px solid #50FA7B; border-radius: 8px">
                          <sc-for list="{{diff}}" as="df"><div data-key="{{df.key}}" style="display: flex; gap: 8px; padding: 3px 6px; border-radius: 4px; background: {{df.bg}}; color: {{df.fg}}; font-size: 11px"><span>{{df.sign}}</span><span style="overflow-wrap: anywhere">{{df.text}}</span></div></sc-for>
                          <button type="button" onClick="{{writeEntries}}" style="align-self: flex-end; display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: #50FA7B; color: #282A36; font: inherit; font-weight: 700; cursor: pointer"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>Write to VPS</button>
                        </div>
                      </sc-if>
                    </sc-if>

                    <sc-if value="{{cfgMcp}}" hint-placeholder-val="{{false}}">
                      <span style="color: #A9B2D3">MCP servers for {{cfgA.label}} <span style="color: #8B95BD">· <code style="color: #F1FA8C">hermes -p {{cfgA.name}} mcp list</code></span></span>
                      <div style="border: 1px solid #44475A; border-radius: 8px; overflow: hidden">
                        <sc-for list="{{mcpRows}}" as="m" hint-placeholder-count="3">
                          <div data-key="{{m.name}}" style="display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; border-bottom: 1px dashed #343746">
                            <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px">
                              <span style="color: #F8F8F2; font-weight: 600">{{m.name}}</span><span class="tag">{{m.transport}}</span>
                              <span style="padding: 0 6px; border: 1px solid {{m.color}}; color: {{m.color}}; font-size: 11px">{{m.status}}</span>
                              <span style="color: #8B95BD; font-size: 11px">{{m.tools}}</span>
                              <button type="button" class="cb" onClick="{{m.test}}" style="margin-left: auto"><svg class="ic" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>{{m.testLabel}}</button>
                            </div>
                            <code style="color: #F1FA8C; font-size: 11px; overflow-wrap: anywhere">{{m.target}}</code>
                            <span style="font-size: 11px; color: #8B95BD">{{m.env}}</span>
                            <sc-if value="{{m.hasNote}}"><span style="font-size: 11px; color: {{m.noteColor}}">{{m.note}}</span></sc-if>
                          </div>
                        </sc-for>
                      </div>
                      <div style="display: flex; gap: 8px; padding: 8px 10px; border: 1px solid #44475A; border-radius: 8px; background: #282A36; color: #A9B2D3; font-size: 11px">
                        <span style="color: #8BE9FD; display: flex; padding-top: 1px"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                        <span>Names, commands and URLs only. The config can hold tokens inline in <code style="color: #F1FA8C">env</code> and <code style="color: #F1FA8C">headers</code>, so Mission Control lists servers through <code style="color: #F1FA8C">mcp list</code> and never reads those values. Test starts the server once to check it connects.</span>
                      </div>
                      <div style="display: flex; flex-wrap: wrap; gap: 6px">
                        <button type="button" class="cb" onClick="{{mcpAdd}}"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Add a server in the terminal</button>
                        <button type="button" class="cb" onClick="{{mcpRemove}}"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Remove one in the terminal</button>
                      </div>
                    </sc-if>

                    <sc-if value="{{cfgTools}}" hint-placeholder-val="{{false}}">
                      <span style="color: #A9B2D3">Toolsets for {{cfgA.label}} per platform <span style="color: #8B95BD">· <code style="color: #F1FA8C">hermes -p {{cfgA.name}} tools --summary</code></span></span>
                      <div style="border: 1px solid #44475A; border-radius: 8px; overflow-x: auto">
                        <table style="width: 100%; border-collapse: collapse; font-size: 12px">
                          <thead><tr style="color: #A9B2D3"><th style="padding: 6px 10px; text-align: left; font-weight: 600">TOOLSET</th><sc-for list="{{tsCols}}" as="c"><th data-key="{{c.key}}" style="padding: 6px 8px; text-align: center; font-weight: 600">{{c.label}}</th></sc-for></tr></thead>
                          <tbody>
                            <sc-for list="{{tsRows}}" as="r">
                              <tr data-key="{{r.name}}" style="border-top: 1px dashed #343746">
                                <td style="padding: 5px 10px"><span style="color: #F8F8F2">{{r.name}}</span><span style="display: block; color: #8B95BD; font-size: 11px">{{r.hint}}</span></td>
                                <sc-for list="{{r.cells}}" as="c"><td data-key="{{c.key}}" style="padding: 0 8px; text-align: center"><button type="button" role="checkbox" class="ckb" aria-checked="{{c.checked}}" aria-label="{{c.label}}" onClick="{{c.toggle}}" style="border-color: {{c.border}}"><sc-if value="{{c.on}}"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></sc-if></button></td></sc-for>
                              </tr>
                            </sc-for>
                          </tbody>
                        </table>
                      </div>
                      <span style="color: #8B95BD; font-size: 11px">Orange outlines are changes you have not applied. Applying affects new sessions; restart the gateway to reach chats already running. Approval policy is read-only and lives in Logs → Approvals.</span>
                      <sc-if value="{{tsHasPending}}">
                        <div class="mc-down" style="display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border: 1px solid #FFB86C; border-radius: 8px; background: #282A36">
                          <span style="color: #F8F8F2; font-weight: 600">{{tsPendingTitle}}</span>
                          <pre class="cmd">{{tsCommands}}</pre>
                          <span style="display: flex; gap: 6px; justify-content: flex-end"><button type="button" class="cb" onClick="{{tsDiscard}}">Discard</button><button type="button" class="cb pri" onClick="{{tsApply}}"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>Apply on the VPS</button></span>
                        </div>
                      </sc-if>
                    </sc-if>

                    <sc-if value="{{cfgFallback}}" hint-placeholder-val="{{false}}">
                      <span style="color: #A9B2D3">If {{cfgA.label}}’s main model fails, Hermes tries these in order <span style="color: #8B95BD">· <code style="color: #F1FA8C">hermes -p {{cfgA.name}} fallback list</code></span></span>
                      <div style="border: 1px solid #44475A; border-radius: 8px; overflow: hidden">
                        <sc-for list="{{fbRows}}" as="f">
                          <div data-key="{{f.key}}" style="display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 4px 10px; border-bottom: 1px dashed #343746">
                            <span class="num" style="width: 18px; color: #8B95BD">{{f.n}}</span>
                            <span style="color: #F8F8F2; font-weight: 600">{{f.provider}}</span>
                            <span style="flex: 1; min-width: 0; color: #F1FA8C; overflow-wrap: anywhere">{{f.model}}</span>
                            <span class="tag">{{f.note}}</span>
                          </div>
                        </sc-for>
                        <sc-if value="{{fbEmpty}}"><div style="padding: 14px 10px; color: #A9B2D3">No fallback models yet. If the main model is down, this agent stops with an error.</div></sc-if>
                      </div>
                      <div style="display: flex; flex-wrap: wrap; gap: 6px">
                        <button type="button" class="cb" onClick="{{fbAdd}}"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Add one in the terminal</button>
                        <button type="button" class="cb" onClick="{{fbRemove}}"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg>Remove one in the terminal</button>
                      </div>
                      <span style="color: #8B95BD; font-size: 11px">Adding and removing run in the terminal so Hermes can show its own picker. Mission Control only fills in the command; you press Enter.</span>
                    </sc-if>

                    <sc-if value="{{cfgBackup}}" hint-placeholder-val="{{false}}">
                      <span style="color: #A9B2D3">Download a copy of {{cfgA.label}}’s files to this computer. Nothing is written on the VPS.</span>
                      <div style="border: 1px solid #44475A; border-radius: 8px; overflow: hidden">
                        <sc-for list="{{bkRows}}" as="b">
                          <div data-key="{{b.key}}" style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 4px 10px; border-bottom: 1px dashed #343746">
                            <button type="button" role="checkbox" class="ckb" aria-checked="{{b.checked}}" aria-label="{{b.label}}" onClick="{{b.toggle}}"><sc-if value="{{b.on}}"><svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></sc-if></button>
                            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="color: #F8F8F2">{{b.label}}</span><span style="color: #8B95BD; font-size: 11px">{{b.hint}}</span></div>
                            <span class="num" style="color: #A9B2D3; font-size: 11px">{{b.size}}</span>
                          </div>
                        </sc-for>
                      </div>
                      <div style="display: flex; gap: 8px; padding: 8px 10px; border: 1px solid #44475A; border-radius: 8px; background: #282A36; color: #A9B2D3; font-size: 11px">
                        <span style="color: #8BE9FD; display: flex; padding-top: 1px"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                        <span>Never included: <code style="color: #F1FA8C">.env</code>, <code style="color: #F1FA8C">auth.json</code> and cached MCP tokens. <code style="color: #F1FA8C">config.yaml</code> is saved with <code style="color: #F1FA8C">env</code>, <code style="color: #F1FA8C">headers</code> and API-key values blanked.</span>
                      </div>
                      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
                        <button type="button" class="cb pri" onClick="{{bkRun}}"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Download {{bkCount}} items ({{bkTotal}})</button>
                        <span style="color: #8B95BD; font-size: 11px">to ~/Documents/hermes-backups/{{cfgA.name}}-2026-10-11.zip</span>
                      </div>
                      <span style="color: #8B95BD; font-size: 11px">To restore, copy files back yourself or run <code style="color: #F1FA8C">hermes import</code> in the terminal; Mission Control does not overwrite a profile in one click.</span>
                    </sc-if>

                    <sc-if value="{{cfgNew}}" hint-placeholder-val="{{false}}">
                      <span style="color: #F8F8F2; font-weight: 600">Create a new agent profile</span>

ackground: #191A21; color: #F1FA8C; font: inherit; font-size: 11px; white-space: pre-wrap">{{blk.text}}</pre></sc-if></sc-for></div>

              </div>
            </section>
          </sc-if>
        </div>
      </article>
    </div>
  </sc-if>

</div>
</script>
<script type="text/x-dc" id="mc-logic">

    };

      autostart: true, startMin: false, tray: true, updates: true, density: 'compact', uiZoom: '1', reduceMotion: false,
      autoConnect: true, reconnect: true,

      palOpen: false, palQ: '', palSel: 0,
      mcpTest: {}, tsSet: {}, tsApplied: {}, bkSel: {}, np: { name: '', desc: '', from: 'none', noSkills: false }, vw: window.innerWidth,

      termH: term.h || Math.max(160, Math.min(320, Math.round(window.innerHeight * 0.32))),
      termDraft: '',
      termLines: [
        { key: 't1', text: 'Linux vps 6.8.0-45-generic x86_64 · Ubuntu 24.04.1 LTS', color: '#8B95BD' },
        { key: 't2', text: 'root@vps:~# hermes gateway status', color: '#50FA7B' },
        { key: 't3', text: 'gateway: running (multiplex) · pid 1842 · serving 5 profiles · heartbeat 3s ago', color: '#F8F8F2' }
      ],
      toasts: [], notifs: [], unread: 0, dragAgent: null, dragOver: null,
      physTick: 0,

      prov: 'openrouter', base: 'https://openrouter.ai/api/v1', apiKey: '', customName: 'my-gateway', fetch: 'idle', mSel: null, mFilter: '',
      memOrig: this.sampleMemory(), memCur: this.sampleMemory(),

      reviewing: false, saved: false

  }
  sampleMemory() {
    return [
      'User prefers short bullet answers in Telegram; long form only when asked.',
      'VPS: Ubuntu 24.04, 8 vCPU / 16 GB. Hermes runs as root with a multiplex gateway serving 5 profiles.',
      'Vault lives at /root/vault; daily notes in daily/YYYY-MM-DD.md, projects in projects/.',
      'Acme client: weekly sync Thursday 10:00 WIB; uptime report goes to their Telegram group.',
      'Release notes source of truth: GitHub releases page of NousResearch/hermes-agent.'

  }
  sampleUser() {
    return [
      'Name: [YOUR NAME]. Timezone Asia/Jakarta (WIB).',
      'Writes in Indonesian and English; reply in the language of the question.',
      'Runs several Hermes agents on one VPS and monitors them from Mission Control.'
    ];
  }
  // ---- draggable graph nodes (Obsidian-like: springs, repulsion, weak anchor) ----
  physEnsure(key, nodes, links) {
    this.phys = this.phys || {};
    if (this.phys[key] && this.phys[key].p.length === nodes.length) { return; }
    this.phys[key] = {
      p: nodes.map(function (n) { return { x: n.x, y: n.y, ox: n.x, oy: n.y, vx: 0, vy: 0 }; }),
      links: links.map(function (l) {
        var a = nodes[l[0]], b = nodes[l[1]];
        return { a: l[0], b: l[1], len: Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)) };
      }),
      drag: null, until: 0, raf: 0, justDragged: false
    };
  }
  physAt(key, i) {
    return this.phys && this.phys[key] ? this.phys[key].p[i] : null;
  }
  physStep(key) {
    var s = this.phys[key];
    var p = s.p;
    var i, j;
    s.links.forEach(function (l) {
      var a = p[l.a], b = p[l.b];
      var dx = b.x - a.x, dy = b.y - a.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var f = (d - l.len) * 0.04 / d;
      a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
    });
    for (i = 0; i < p.length; i++) {
      for (j = i + 1; j < p.length; j++) {
        var ex = p[j].x - p[i].x, ey = p[j].y - p[i].y;
        var dd = ex * ex + ey * ey;
        if (dd < 3600 && dd > 0.01) {
          var dist = Math.sqrt(dd);
          var rf = (60 - dist) * 0.02 / dist;
          p[i].vx -= ex * rf; p[i].vy -= ey * rf; p[j].vx += ex * rf; p[j].vy += ey * rf;
        }
      }
    }
    var energy = 0;
    p.forEach(function (n, k) {
      if (n.pin || (s.drag && s.drag.i === k)) { n.vx = 0; n.vy = 0; return; }
      n.vx += (n.ox - n.x) * 0.004; n.vy += (n.oy - n.y) * 0.004;
      n.vx *= 0.82; n.vy *= 0.82;
      n.x += n.vx; n.y += n.vy;
      energy += Math.abs(n.vx) + Math.abs(n.vy);
    });
    return energy;
  }
  physRun(key) {
    var self = this;
    var s = this.phys[key];
    if (s.raf) { return; }
    var next = function (f) {
      return document.visibilityState === 'visible' && window.requestAnimationFrame ? window.requestAnimationFrame(f) : setTimeout(f, 16);
    };
    var frame = function () {
      var e = self.physStep(key);
      self.setState({ physTick: self.state.physTick + 1 });
      if (s.drag || (Date.now() < s.until && e > 0.05)) { s.raf = next(frame); } else { s.raf = 0; }
    };
    s.raf = next(frame);
  }
  physGrab(key, i, canvasId, W) {
    var self = this;
    return function (e) {
      var s = self.phys[key];
      var canvas = document.getElementById(canvasId);
      if (!s || !canvas) { return; }
      e.preventDefault();
      var start = { x: e.clientX, y: e.clientY };
      s.drag = { i: i, moved: false };

        n.y = (ev.clientY - r.top) / k;

      window.addEventListener('pointerup', up);

  // ---- graph camera: wheel zoom toward the cursor, drag empty space to pan, fit ----

  }
  viewBump() {

  }
  viewFit(key, panelId, W, H, top, force) {

    var k = Math.max(0.2, Math.min((el.clientWidth - 24) / W, (el.clientHeight - top - 16) / H, 1.6));
    var tx = (el.clientWidth - W * k) / 2;

  viewTransform(key) {

    };
  }
  viewPan(key, panelId) {
    var self = this;

  runCommand(cmd) {
    var c = cmd.trim();
    var out = {
      help: ['try: uptime, whoami, df -h, hermes --version, hermes profile list, hermes cron list, clear'],

      whoami: ['root'],
