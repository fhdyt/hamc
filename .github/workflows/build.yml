name: Build and test

# Checks on every push and pull request; installers for Windows, macOS and Linux on every run (as artifacts) and,
# for a tag like v0.2.0, attached to a draft GitHub release. See docs/release.md.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install pytest
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:py

  package:
    name: Installer (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
            artifacts: |
              dist/*-win-x64.exe
              dist/*-win-x64.exe.blockmap
              dist/latest.yml
          - name: macOS
            os: macos-latest
            script: dist:mac
            artifacts: |
              dist/*.dmg
              dist/*-mac-universal.zip
              dist/*-mac-universal.zip.blockmap
              dist/latest-mac.yml
          - name: Linux
            os: ubuntu-latest
            script: dist:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
              dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci

      # Linux needs a display and a keyring (Electron safeStorage) to run the app.
      - name: Linux display and keyring
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libsecret-1-0 gnome-keyring dbus-x11

      # The whole suite against out/ on Windows, where the keychain (DPAPI) works on a runner. The other systems run it
      # against the packaged app below and may fail on keychain access until that has been seen working.
      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e

      - name: Build installer
        run: npm run ${{ matrix.script }}

      - name: Packaged app e2e (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e:packaged

      - name: Installer smoke test (Windows)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-installer-win.ps1

      - name: Packaged app e2e (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: npm run test:e2e:packaged

      - name: Packaged app e2e (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo chown root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
          dbus-run-session -- bash -c 'echo -n "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null; xvfb-run -a npm run test:e2e:packaged'

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # The app updates itself from the latest *published* release (electron-updater reads latest*.yml next to the
      # installers), so the draft must be published by hand after a check; drafts and pre-releases are ignored.
      - name: Create a draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "$GITHUB_REF_NAME"
